user  root;
worker_processes 1;

events {
    worker_connections 128;
}

http {
    upstream dockerd {
        server unix:/var/run/docker.sock;
        keepalive 32;
    }

    server {
        listen 2375;
        access_log off;

        # Long-lived Docker events stream — keep alive for up to 30 days
        location ~ "^/v[0-9]+\.[0-9]+/events" {
            rewrite "^/v[0-9]+\.[0-9]+(/.*)$" /v1.45$1 break;
            proxy_pass         http://dockerd;
            proxy_http_version 1.1;
            proxy_set_header   Host "localhost";
            proxy_set_header   Connection "";
            proxy_buffering    off;
            proxy_read_timeout 2592000;
            proxy_send_timeout 2592000;
        }

        # All other versioned Docker API calls
        location ~ "^/v[0-9]+\.[0-9]+" {
            rewrite "^/v[0-9]+\.[0-9]+(/.*)$" /v1.45$1 break;
            proxy_pass         http://dockerd;
            proxy_http_version 1.1;
            proxy_set_header   Host "localhost";
            proxy_set_header   Connection "";
            proxy_buffering    off;
            proxy_read_timeout 86400;
        }

        location / {
            proxy_pass         http://dockerd;
            proxy_http_version 1.1;
            proxy_set_header   Host "localhost";
            proxy_set_header   Connection "";
            proxy_buffering    off;
            proxy_read_timeout 86400;
        }
    }
}
